<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car IPTV Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0b0f19; color: #fff; font-family: sans-serif; display: flex; height: 100vh; overflow: hidden; }
        
        #sidebar { width: 350px; background: #111827; display: flex; flex-direction: column; border-right: 1px solid #1f2937; }
        .header { padding: 15px; background: #030712; font-weight: bold; color: #38bdf8; font-size: 16px; border-bottom: 1px solid #1f2937; display: flex; justify-content: space-between; align-items: center; }
        .tabs { display: flex; background: #1f2937; padding: 5px; }
        .tab-btn { flex: 1; padding: 8px; background: none; border: none; color: #9ca3af; cursor: pointer; font-weight: bold; border-radius: 6px; font-size: 13px; }
        .tab-btn.active { background: #0284c7; color: #fff; }
        
        #list { flex: 1; overflow-y: auto; padding: 10px; }
        .item { padding: 12px; margin-bottom: 6px; background: #1f2937; border-radius: 8px; cursor: pointer; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: 0.2s; }
        .item:hover, .item.active { background: #0284c7; color: #fff; }

        #main { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #000; position: relative; }
        video { width: 100%; height: 100%; max-height: 100vh; object-fit: contain; }
        .watermark { position: absolute; top: 15px; right: 20px; background: rgba(0,0,0,0.6); padding: 5px 10px; border-radius: 5px; font-size: 12px; color: #38bdf8; pointer-events: none; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="header">
            <span>🚗 Car IPTV</span>
            <span id="status" style="font-size:11px; color:#10b981;">Bağlanıyor...</span>
        </div>
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('live')">Canlı TV</button>
            <button class="tab-btn" onclick="switchTab('movie')">Filmler</button>
            <button class="tab-btn" onclick="switchTab('series')">Diziler</button>
        </div>
        <div id="list">
            <div style="text-align:center; padding:20px; color:#9ca3af;">Yükleniyor...</div>
        </div>
    </div>

    <div id="main">
        <div class="watermark" id="nowPlaying">Yayın Seçilmedi</div>
        <video id="videoPlayer" controls autoplay playsinline></video>
    </div>

    <script>
        const CONFIG = {
            server: "http://platindpltn.xyz:8080",
            username: "Onurergn57",
            password: "kQrwS2MqdY"
        };

        let currentType = 'live';
        let rawData = [];
        let hlsInstance = null;

        async function loadData(type) {
            currentType = type;
            let action = type === 'live' ? 'get_live_streams' : (type === 'movie' ? 'get_vod_streams' : 'get_series');
            let apiURL = `${CONFIG.server}/player_api.php?username=${CONFIG.username}&password=${CONFIG.password}&action=${action}`;

            document.getElementById('status').innerText = 'Yükleniyor...';
            
            // Doğrudan public CORS proxy üzerinden veriyi çekiyoruz ki araba tarayıcısı engellemesin
            let proxyURL = `https://api.allorigins.win/raw?url=` + encodeURIComponent(apiURL);

            try {
                let response = await fetch(proxyURL);
                let data = await response.json();
                if(Array.isArray(data)) {
                    rawData = data;
                    renderList(rawData);
                    document.getElementById('status').innerText = 'Bağlandı ✓';
                } else {
                    document.getElementById('status').innerText = 'Veri Hatası!';
                }
            } catch (e) {
                document.getElementById('status').innerText = 'Bağlantı Hatası!';
                console.error(e);
            }
        }

        function switchTab(type) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            loadData(type);
        }

        function renderList(items) {
            const listDiv = document.getElementById('list');
            listDiv.innerHTML = '';
            
            items.forEach(item => {
                let name = item.name || item.title;
                let id = item.stream_id || item.series_id;
                
                let div = document.createElement('div');
                div.className = 'item';
                div.innerText = name;
                div.onclick = () => playStream(id, name);
                listDiv.appendChild(div);
            });
        }

        function playStream(id, name) {
            document.getElementById('nowPlaying').innerText = name;
            let video = document.getElementById('videoPlayer');
            
            let streamURL = "";
            if(currentType === 'live') {
                streamURL = `${CONFIG.server}/live/${CONFIG.username}/${CONFIG.password}/${id}.ts`;
            } else if(currentType === 'movie') {
                streamURL = `${CONFIG.server}/movie/${CONFIG.username}/${CONFIG.password}/${id}.mp4`;
            } else {
                streamURL = `${CONFIG.server}/series/${CONFIG.username}/${CONFIG.password}/${id}.mp4`;
            }

            if (hlsInstance) { hlsInstance.destroy(); }

            if (Hls.isSupported() && currentType === 'live') {
                hlsInstance = new Hls();
                hlsInstance.loadSource(streamURL);
                hlsInstance.attachMedia(video);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => video.play());
            } else {
                video.src = streamURL;
                video.play().catch(() => {});
            }
        }

        loadData('live');
    </script>
</body>
</html>
